repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # ruff replaces black, isort, flake8 (+ docstrings/eradicate/isort plugins),
  # and pyupgrade. Keep the rev in sync with the lint extra in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
    - id: pyright
      additional_dependencies:
        [
          "equinox",
          "interpax",
          "jax",
          "jaxtyping",
          "lineax",
          "mpmath",
          "netcdf4",
          "numpy",
          "optimistix",
          "orthax",
          "pytest",
          "quadax",
          "scipy",
          "sympy",
        ]
