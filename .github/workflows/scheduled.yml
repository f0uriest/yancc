name: Weekly tests

on:
  schedule:
      - cron: '17 9 * * 1'
  workflow_dispatch:

jobs:
  unit_tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        combos: [{group: 1, python_version: '3.11'},
                 {group: 2, python_version: '3.11'},
                 {group: 3, python_version: '3.11'},
                 {group: 4, python_version: '3.11'},
                 {group: 5, python_version: '3.11'},
                 {group: 6, python_version: '3.11'},
                 {group: 7, python_version: '3.11'},
                 {group: 8, python_version: '3.11'},
                 {group: 1, python_version: '3.14'},
                 {group: 2, python_version: '3.14'},
                 {group: 3, python_version: '3.14'},
                 {group: 4, python_version: '3.14'},
                 {group: 5, python_version: '3.14'},
                 {group: 6, python_version: '3.14'},
                 {group: 7, python_version: '3.14'},
                 {group: 8, python_version: '3.14'}]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.combos.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.combos.python_version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # DESC caps jax and other shared dependencies below the newest versions, so
          # only install it on the older python. The newer python tests the latest
          # dependencies, with the tests comparing against DESC skipped.
          if [ "${{ matrix.combos.python_version }}" = "3.11" ]; then
            pip install --upgrade -e ".[dev,desc]"
          else
            pip install --upgrade -e ".[dev]"
          fi
          pip list
      - name: Test with pytest
        run: |
          pwd
          lscpu
          python -m pytest -v  \
            --durations=0 \
            --cov-report xml:cov.xml \
            --cov-config=pyproject.toml \
            --cov=yancc/ \
            --splits 8 \
            --group ${{ matrix.combos.group }} \
            --splitting-algorithm least_duration \
      - name: save coverage file and plot comparison results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit_test_artifact-${{ matrix.combos.python_version }}-${{ matrix.combos.group }}
          path: |
            ./cov.xml
      - name: Upload coverage
        id : codecov
        uses: codecov/codecov-action@v7
        with:
          name: codecov-umbrella
          files: ./cov.xml
          fail_ci_if_error: true
          verbose: true
